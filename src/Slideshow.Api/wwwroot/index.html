<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Slideshows</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>

<header class="bar">
  <h1>Slideshows</h1>
  <span class="spacer"></span>
  <a class="btn" id="newShow" href="/upload.html" hidden>New slideshow</a>
  <button id="auth">Sign in</button>
</header>

<main>
  <section id="loginView" hidden>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password">
    <p><button class="primary" id="login">Sign in</button></p>
    <p class="error" id="loginError"></p>
  </section>

  <ul class="cards" id="cards"></ul>
  <p id="empty" class="muted" hidden>No slideshows yet.</p>
</main>

<script src="/app.js"></script>
<script>
const cards = document.getElementById('cards');
const empty = document.getElementById('empty');
const auth = document.getElementById('auth');
const newShow = document.getElementById('newShow');
const loginView = document.getElementById('loginView');
const password = document.getElementById('password');
const loginError = document.getElementById('loginError');

const ACCESS_NAMES = ['Public', 'Extended', 'Family'];

let albums = [];

function actionButton(label, title, handler) {
  const button = document.createElement('button');
  button.textContent = label;
  button.title = title;
  button.setAttribute('aria-label', title);
  button.addEventListener('click', e => { e.preventDefault(); handler(); });
  return button;
}

// Symbolen sätts i CSS, eftersom riktningen beror på om korten ligger i rad eller kolumn.
function moveButton(direction, title, handler) {
  const button = actionButton('', title, handler);
  button.dataset.move = direction;
  return button;
}

async function move(from, delta) {
  const to = from + delta;
  if (to < 0 || to >= albums.length) return;

  const before = [...albums];
  [albums[from], albums[to]] = [albums[to], albums[from]];
  render();

  try {
    // Hela ordningen skickas, servern numrerar om. Slipper räkna ut enskilda positioner.
    const res = await App.send('PUT', '/api/slideshows/order', { slugs: albums.map(a => a.slug) });
    if (!res.ok) throw new Error(await App.errorText(res));
  } catch (err) {
    // Annars ligger listan kvar i en ordning som servern inte känner till.
    albums = before;
    render();
    alert(`Could not save the order: ${err.message}`);
  }
}

async function remove(album) {
  if (!confirm(`Delete "${album.title}" with ${album.slideCount} images?`)) return;

  const res = await App.send('DELETE', `/api/slideshows/${album.slug}`);
  if (!res.ok) { alert(await App.errorText(res)); return; }

  albums = albums.filter(a => a.slug !== album.slug);
  render();
}

function card(album, i) {
  const item = document.createElement('li');
  item.className = 'card';

  const link = document.createElement('a');
  link.href = `/s/${album.slug}`;

  const img = new Image();
  img.src = album.cover || '';
  img.alt = '';
  img.loading = 'lazy';
  img.decoding = 'async';

  const meta = document.createElement('div');
  meta.className = 'meta';

  const title = document.createElement('strong');
  // textContent, aldrig innerHTML: titeln är användarinmatad.
  title.textContent = album.title;
  if (album.isDraft) {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = 'draft';
    title.append(tag);
  }

  if (album.access > 0) {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = ACCESS_NAMES[album.access];
    title.append(tag);
  }

  const count = document.createElement('span');
  const date = new Date(album.createdUtc).toLocaleDateString('en-GB');
  count.textContent = `${album.slideCount} images · ${date}`;

  meta.append(title, count);
  link.append(img, meta);
  item.append(link);

  if (App.isAdmin) {
    const actions = document.createElement('div');
    actions.className = 'actions';

    const up = moveButton('prev', 'Move earlier in the list', () => move(i, -1));
    up.disabled = i === 0;

    const down = moveButton('next', 'Move later in the list', () => move(i, 1));
    down.disabled = i === albums.length - 1;

    actions.append(up, down, actionButton('✕', 'Delete the slideshow', () => remove(album)));
    item.append(actions);
  }

  return item;
}

function render() {
  cards.replaceChildren(...albums.map(card));
  empty.hidden = albums.length > 0;
}

// Bara admin får ladda upp. Servern nekar ändå, men länken ska inte locka.
function renderSession() {
  newShow.hidden = !App.isAdmin;
  auth.textContent = App.level > 0 ? 'Sign out' : 'Sign in';
  if (App.level > 0) loginView.hidden = true;
}

async function loadAlbums() {
  const res = await fetch('/api/slideshows', { cache: 'no-store' });
  albums = await res.json();
  render();
}

async function signIn() {
  loginError.textContent = '';

  const res = await App.send('POST', '/api/login', { password: password.value });

  if (!res.ok) {
    loginError.textContent = await App.errorText(res);
    return;
  }

  password.value = '';
  // Antiforgery-token är bunden till identiteten och måste hämtas om efter login.
  await App.loadSession();
  renderSession();
  await loadAlbums();
}

auth.addEventListener('click', async () => {
  if (App.level > 0) {
    await App.send('POST', '/api/logout');
    await App.loadSession();
    renderSession();
    await loadAlbums();
    return;
  }

  loginView.hidden = !loginView.hidden;
  if (!loginView.hidden) password.focus();
});

document.getElementById('login').addEventListener('click', signIn);
password.addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });

(async function load() {
  await App.loadSession();
  renderSession();
  await loadAlbums();
})();
</script>
</body>
</html>
