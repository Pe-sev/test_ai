<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bildspel</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>

<header class="bar">
  <h1>Bildspel</h1>
  <span class="spacer"></span>
  <a class="btn" href="/upload.html">Nytt bildspel</a>
</header>

<main>
  <ul class="cards" id="cards"></ul>
  <p id="empty" class="muted" hidden>Inga bildspel än.</p>
</main>

<script src="/app.js"></script>
<script>
const cards = document.getElementById('cards');
const empty = document.getElementById('empty');

function card(album) {
  const item = document.createElement('li');
  item.className = 'card';

  const link = document.createElement('a');
  link.href = `/s/${album.slug}`;

  const img = new Image();
  img.src = album.cover || '';
  img.alt = '';
  img.loading = 'lazy';
  img.decoding = 'async';

  const meta = document.createElement('div');
  meta.className = 'meta';

  const title = document.createElement('strong');
  // textContent, aldrig innerHTML: titeln är användarinmatad.
  title.textContent = album.title;
  if (album.isDraft) {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = 'utkast';
    title.append(tag);
  }

  const count = document.createElement('span');
  const date = new Date(album.createdUtc).toLocaleDateString('sv-SE');
  count.textContent = `${album.slideCount} bilder · ${date}`;

  meta.append(title, count);
  link.append(img, meta);
  item.append(link);

  if (App.isAdmin) {
    const remove = document.createElement('button');
    remove.className = 'remove';
    remove.textContent = 'Radera';
    remove.addEventListener('click', async e => {
      e.preventDefault();
      if (!confirm(`Radera "${album.title}" med ${album.slideCount} bilder?`)) return;

      const res = await App.send('DELETE', `/api/slideshows/${album.slug}`);
      if (res.ok) item.remove();
      else alert(await App.errorText(res));
    });
    item.append(remove);
  }

  return item;
}

(async function load() {
  await App.loadSession();

  const res = await fetch('/api/slideshows', { cache: 'no-store' });
  const albums = await res.json();

  cards.replaceChildren(...albums.map(card));
  empty.hidden = albums.length > 0;
})();
</script>
</body>
</html>
