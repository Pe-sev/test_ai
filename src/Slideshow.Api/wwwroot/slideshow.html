<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Slideshow</title>
<link rel="stylesheet" href="/site.css">
</head>
<body class="viewer">

<header class="bar">
  <a class="btn" href="/">&larr; All</a>
  <h1 id="title">&hellip;</h1>
  <select id="access" hidden aria-label="Access level">
    <option value="0">Public</option>
    <option value="1">Extended</option>
    <option value="2">Family</option>
  </select>
  <button id="toggleView">Overview</button>
  <button id="play">Play</button>
  <button id="full">Full screen</button>
</header>

<section id="stage" class="stage">
  <button class="nav prev" id="prev" aria-label="Previous">&lsaquo;</button>
  <figure>
    <img id="photo" alt="">
    <figcaption id="caption"></figcaption>
  </figure>
  <button class="nav next" id="next" aria-label="Next">&rsaquo;</button>
  <div class="counter" id="counter"></div>
  <button class="exit" id="exitFull" aria-label="Exit full screen">&#10005;</button>
</section>

<nav id="strip" class="strip" aria-label="Thumbnails"></nav>

<section id="grid" class="grid" hidden></section>

<main id="message" hidden></main>

<script src="/app.js"></script>
<script>
const slug = decodeURIComponent(location.pathname.replace(/^\/s\//, '').replace(/\/$/, ''));

const ACCESS_NAMES = ['Public', 'Extended', 'Family'];

const el = {
  title: document.getElementById('title'),
  stage: document.getElementById('stage'),
  strip: document.getElementById('strip'),
  grid: document.getElementById('grid'),
  photo: document.getElementById('photo'),
  caption: document.getElementById('caption'),
  counter: document.getElementById('counter'),
  message: document.getElementById('message'),
  toggleView: document.getElementById('toggleView'),
  play: document.getElementById('play'),
  full: document.getElementById('full'),
  access: document.getElementById('access')
};

let slides = [];
let index = 0;
let timer = null;

function indexFromHash() {
  const n = parseInt(location.hash.slice(1), 10);
  return Number.isFinite(n) ? Math.min(Math.max(n - 1, 0), slides.length - 1) : 0;
}

function show(i, push = true) {
  if (slides.length === 0) return;

  index = (i + slides.length) % slides.length;
  const slide = slides[index];

  el.photo.src = slide.full;
  el.photo.alt = slide.caption || '';
  // textContent, aldrig innerHTML: bildtexten är användarinmatad.
  el.caption.textContent = slide.caption || '';
  el.counter.textContent = `${index + 1} / ${slides.length}`;

  const hash = '#' + (index + 1);
  if (push && location.hash !== hash) {
    history.pushState(null, '', hash);
  } else if (!push) {
    history.replaceState(null, '', hash);
  }

  preload(index + 1);
  preload(index - 1);
  highlightThumb();
}

function preload(i) {
  if (slides.length === 0) return;
  const slide = slides[(i + slides.length) % slides.length];
  new Image().src = slide.full;
}

function highlightThumb() {
  for (const container of [el.strip, el.grid]) {
    [...container.children].forEach((img, i) => img.classList.toggle('active', i === index));
  }

  revealThumb();
}

// Sidvändning i stället för centrering: raden man hamnar på flyttas till kanten, så att
// hela spalten fylls med nya bilder i stället för att rycka en bit vid varje bildbyte.
function revealThumb() {
  const thumb = el.strip.children[index];
  if (!thumb || el.strip.hidden) return;

  const box = el.strip.getBoundingClientRect();
  const item = thumb.getBoundingClientRect();
  const pad = getComputedStyle(el.strip);

  // Bara en axel kan svämma över — den andra är overflow:hidden i respektive läge.
  if (el.strip.scrollHeight > el.strip.clientHeight) {
    if (item.bottom > box.bottom) {
      scrollStrip('top', el.strip.scrollTop + item.top - box.top - parseFloat(pad.paddingTop));
    } else if (item.top < box.top) {
      scrollStrip('top', el.strip.scrollTop + item.bottom - box.bottom + parseFloat(pad.paddingBottom));
    }
  } else if (el.strip.scrollWidth > el.strip.clientWidth) {
    if (item.right > box.right) {
      scrollStrip('left', el.strip.scrollLeft + item.left - box.left - parseFloat(pad.paddingLeft));
    } else if (item.left < box.left) {
      scrollStrip('left', el.strip.scrollLeft + item.right - box.right + parseFloat(pad.paddingRight));
    }
  }
}

function scrollStrip(axis, value) {
  el.strip.scrollTo({ [axis]: value, behavior: 'smooth' });
}

function stopPlayback() {
  if (timer === null) return;
  clearInterval(timer);
  timer = null;
  el.play.textContent = 'Play';
}

function togglePlayback() {
  if (timer !== null) { stopPlayback(); return; }
  // replaceState under uppspelning, annars fylls historiken med ett steg per bild.
  timer = setInterval(() => show(index + 1, false), 5000);
  el.play.textContent = 'Pause';
}

function showGrid(on) {
  el.grid.hidden = !on;
  el.stage.hidden = on;
  el.strip.hidden = on;
  el.toggleView.textContent = on ? 'Show image' : 'Overview';
  if (on) stopPlayback(); else highlightThumb();
}

function thumbnail(slide, i) {
  const img = new Image();
  img.src = slide.thumb;
  img.alt = slide.caption || '';
  img.loading = 'lazy';
  img.decoding = 'async';
  img.addEventListener('click', () => { stopPlayback(); showGrid(false); show(i); });
  return img;
}

function buildThumbs() {
  el.strip.replaceChildren(...slides.map(thumbnail));
  el.grid.replaceChildren(...slides.map(thumbnail));
}

function enableCaptionEditing() {
  el.caption.contentEditable = 'true';
  el.caption.title = 'Click to write a caption';

  el.caption.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); el.caption.blur(); }
    if (e.key === 'Escape') { el.caption.textContent = slides[index].caption || ''; el.caption.blur(); }
    e.stopPropagation();
  });

  el.caption.addEventListener('blur', async () => {
    const text = el.caption.textContent.trim();
    if (text === (slides[index].caption || '')) return;

    const slide = slides[index];
    const res = await App.send('PUT', `/api/slideshows/${encodeURIComponent(slug)}/slides/${slide.id}/caption`,
      { caption: text });

    if (res.ok) {
      slide.caption = (await res.json()).caption;
      el.caption.textContent = slide.caption;
      el.photo.alt = slide.caption;
    } else {
      el.caption.textContent = slide.caption || '';
      alert(await App.errorText(res));
    }
  });
}

function enableAccessControl(album) {
  el.access.hidden = false;
  el.access.value = String(album.access);

  el.access.addEventListener('change', async () => {
    const res = await App.send('PUT', `/api/slideshows/${encodeURIComponent(slug)}/access`,
      { access: Number(el.access.value) });

    if (!res.ok) {
      el.access.value = String(album.access);
      alert(await App.errorText(res));
      return;
    }

    album.access = (await res.json()).access;
  });
}

document.getElementById('prev').addEventListener('click', () => { stopPlayback(); show(index - 1); });
document.getElementById('next').addEventListener('click', () => { stopPlayback(); show(index + 1); });
el.toggleView.addEventListener('click', () => showGrid(el.grid.hidden));
el.play.addEventListener('click', togglePlayback);

function setFullscreen(on) {
  document.body.classList.toggle('fs', on);
  el.full.textContent = on ? 'Exit' : 'Full screen';

  // Äkta helskärm där den finns. iPhone saknar den för vanliga element, därför CSS-läget ovan.
  if (on) document.documentElement.requestFullscreen?.().catch(() => {});
  else if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
}

el.full.addEventListener('click', () => setFullscreen(!document.body.classList.contains('fs')));
document.getElementById('exitFull').addEventListener('click', () => setFullscreen(false));

document.addEventListener('keydown', e => {
  if (e.target.isContentEditable || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') { stopPlayback(); show(index + 1); }
  if (e.key === 'ArrowLeft') { stopPlayback(); show(index - 1); }
  if (e.key === ' ') { e.preventDefault(); togglePlayback(); }
  if (e.key === 'Escape' && document.body.classList.contains('fs')) setFullscreen(false);
});

let touchX = null;
el.stage.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, { passive: true });
el.stage.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) < 40) return;
  stopPlayback();
  show(dx < 0 ? index + 1 : index - 1);
}, { passive: true });

window.addEventListener('popstate', () => show(indexFromHash(), false));

// Rotation flyttar tumnagelraden mellan vågrät och lodrät — gammal scrollposition pekar då fel.
let revealQueued = false;
window.addEventListener('resize', () => {
  if (revealQueued) return;
  revealQueued = true;
  requestAnimationFrame(() => { revealQueued = false; revealThumb(); });
});

function showMessage(...content) {
  el.stage.hidden = true;
  el.strip.hidden = true;
  el.message.hidden = false;
  el.message.replaceChildren(...content);
}

function showLocked(info) {
  // Bildkontrollerna styr inget så länge bildspelet är låst.
  for (const control of [el.toggleView, el.play, el.full]) control.hidden = true;

  el.title.textContent = info.title;
  document.title = info.title;

  const heading = document.createElement('p');
  heading.textContent = `"${info.title}" is locked. Enter the ${ACCESS_NAMES[info.access]} password.`;

  const label = document.createElement('label');
  label.setAttribute('for', 'unlock');
  label.textContent = 'Password';

  const input = document.createElement('input');
  input.type = 'password';
  input.id = 'unlock';
  input.autocomplete = 'current-password';

  const button = document.createElement('button');
  button.className = 'primary';
  button.textContent = 'Unlock';

  const actions = document.createElement('p');
  actions.append(button);

  const error = document.createElement('p');
  error.className = 'error';

  async function unlock() {
    error.textContent = '';

    const res = await App.send('POST', '/api/login', { password: input.value });

    if (!res.ok) {
      error.textContent = await App.errorText(res);
      return;
    }

    input.value = '';
    // Antiforgery-token är bunden till identiteten och måste hämtas om efter login.
    await App.loadSession();
    start();
  }

  button.addEventListener('click', unlock);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

  showMessage(heading, label, input, actions, error);
  input.focus();
}

async function start() {
  await App.loadSession();

  const res = await fetch(`/api/slideshows/${encodeURIComponent(slug)}`, { cache: 'no-store' });

  if (res.status === 403) {
    showLocked(await res.json());
    return;
  }

  if (!res.ok) {
    showMessage('The slideshow does not exist.');
    return;
  }

  const album = await res.json();
  slides = album.slides;
  el.title.textContent = album.title + (album.isDraft ? ' (draft)' : '');
  document.title = album.title;

  if (slides.length === 0) {
    showMessage('The slideshow is empty.');
    return;
  }

  el.message.hidden = true;
  el.stage.hidden = false;
  el.strip.hidden = false;
  for (const control of [el.toggleView, el.play, el.full]) control.hidden = false;

  buildThumbs();

  if (App.isAdmin) {
    enableCaptionEditing();
    enableAccessControl(album);
  }

  show(indexFromHash(), false);
}

start();
</script>
</body>
</html>
